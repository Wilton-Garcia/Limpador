name: Native macOS tests
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, macos-15-intel]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Record native architecture and toolchain
        run: |
          uname -m
          swift --version
      - name: Run tests on the native runner
        run: |
          set +e
          swift test > native-tests.log 2>&1
          result=$?
          cat native-tests.log
          if [ "$result" -ne 0 ]; then
            python3 - <<'PYLOG'
          from pathlib import Path
          lines = Path('native-tests.log').read_text(errors='replace').splitlines()
          failures = [line for line in lines if 'error:' in line or 'failed' in line.lower()]
          for line in (failures or lines[-20:])[:30]:
              escaped = line.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
              print('::error::' + escaped)
          PYLOG
          fi
          exit "$result"
      - name: Build runtime
        run: swift build -c release
